<script>
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let gy=jy+621,leapJ=-14,jp=BR[0],jm,jump,i;
 for(i=1;i<BR.length;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 let n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ++;
 const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150,march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;
 let leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
 return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
 return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j+=div(div(4*jdn+183187720,146097)*3,4)*4-3908;
 const i=div(mod(j,1461),4)*5+308,gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return[gy,gm,gd]}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn)[0];let jy=gy-621;const r=jalCal(jy),f=g2d(gy,3,r.march);let k=jdn-f,jm,jd;
 if(k>=0){if(k<=185){return[jy,1+div(k,31),mod(k,31)+1]}k-=186}
 else{jy--;k+=179;if(r.leap===1)k++}
 return[jy,7+div(k,30),mod(k,30)+1]}
const mlen=(y,m)=>m<=6?31:m<=11?30:(jalCal(y).leap===0?30:29);

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const GM=['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
const HM=['محرم','صفر','ربیع‌الاول','ربیع‌الثانی','جمادی‌الاول','جمادی‌الثانی','رجب','شعبان','رمضان','شوال','ذی‌القعده','ذی‌الحجه'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const wdOf=j=>WD[(j+2)%7]; // 0 = شنبه
const isFri=j=>(j+2)%7===6;
const MN=[JM,GM,HM];
const JE=["Farvardin","Ordibehesht","Khordad","Tir","Mordad","Shahrivar","Mehr","Aban","Azar","Dey","Bahman","Esfand"];
const HA=["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const HE=["Muharram","Safar","Rabī’ al-awwal","Rabī’ al-thānī","Jumādā al-ūlā","Jumādā al-ākhirah","Rajab","Sha’bān","Ramadān","Shawwāl","Dhū al-Qa’dah","Dhū al-Ḥijjah"];
const GE=["January","February","March","April","May","June","July","August","September","October","November","December"];
const mnm=(c,m)=>`${MN[c][m-1]} (ماه ${fa(m)})`;

// تعطیلات رسمی
const JH={'1/1':'جشن نوروز','1/2':'عید نوروز','1/3':'عید نوروز','1/4':'عید نوروز','1/12':'روز جمهوری اسلامی','1/13':'روز طبیعت (سیزده‌به‌در)','3/14':'رحلت امام خمینی','3/15':'قیام ۱۵ خرداد','11/22':'پیروزی انقلاب اسلامی','12/29':'ملی شدن صنعت نفت'};
const HH={'1/9':'تاسوعای حسینی','1/10':'عاشورای حسینی','2/20':'اربعین حسینی','2/28':'رحلت پیامبر و شهادت امام حسن (ع)','2/30':'شهادت امام رضا (ع)','3/17':'ولادت پیامبر و امام صادق (ع)','6/3':'شهادت حضرت فاطمه (س)','7/13':'ولادت امام علی (ع)','7/27':'مبعث پیامبر (ص)','8/15':'ولادت امام زمان (عج)','9/21':'شهادت امام علی (ع)','10/1':'عید سعید فطر','10/2':'تعطیل به مناسبت عید فطر','10/25':'شهادت امام صادق (ع)','12/10':'عید سعید قربان','12/18':'عید سعید غدیر خم'};
// مناسبت‌های غیررسمی
const JO={'1/20':'روز ملی فناوری هسته‌ای','1/29':'روز ارتش جمهوری اسلامی','2/9':'روز ملی ارتباطات و روابط عمومی','2/10':'روز ملی خلیج فارس','3/1':'روز بزرگداشت ملاصدرا','4/14':'روز قلم','5/14':'روز مشروطیت','5/26':'روز بازگشت آزادگان به میهن','6/5':'روز داروساز؛ بزرگداشت محمدبن زکریای رازی','7/14':'روز دامپزشکی','8/18':'روز ملی کودک','8/24':'روز کتاب و کتابخوانی','9/7':'روز نیروی دریایی','11/19':'روز نیروی هوایی','1/25':'روز بزرگداشت عطار','2/1':'روز بزرگداشت سعدی','2/12':'روز معلم','2/25':'روز بزرگداشت فردوسی','3/3':'آزادسازی خرمشهر','4/7':'روز شهدای هفتم تیر','5/17':'روز خبرنگار','6/1':'روز بزرگداشت ابوعلی سینا؛ روز پزشک','6/27':'روز شعر و ادب فارسی','7/7':'روز آتش‌نشانی','7/8':'روز بزرگداشت مولوی','7/20':'روز بزرگداشت حافظ','8/13':'روز دانش‌آموز','9/5':'روز بسیج','9/16':'روز دانشجو','11/12':'بازگشت امام خمینی به ایران','12/5':'روز مهندس؛ بزرگداشت خواجه نصیرالدین طوسی','12/15':'روز درختکاری'};
const HO={'1/25':'شهادت امام سجاد (ع)','3/1':'هجرت پیامبر (ص) از مکه به مدینه','3/12':'آغاز هفته وحدت (میلاد پیامبر به روایت اهل سنت)','4/8':'ولادت امام حسن عسکری (ع)','5/5':'ولادت حضرت زینب (س)؛ روز پرستار','7/1':'ولادت امام باقر (ع)','7/5':'ولادت امام هادی (ع)','7/15':'وفات حضرت زینب (س)','8/11':'ولادت حضرت علی‌اکبر (ع)؛ روز جوان','9/10':'وفات حضرت خدیجه (س)','12/24':'روز مباهله','1/1':'آغاز سال هجری قمری','2/7':'ولادت امام موسی کاظم (ع)','3/8':'شهادت امام حسن عسکری (ع)','3/9':'آغاز امامت امام زمان (عج)','6/20':'ولادت حضرت فاطمه (س)؛ روز مادر و زن','7/3':'شهادت امام هادی (ع)','7/10':'ولادت امام جواد (ع)','7/25':'شهادت امام کاظم (ع)','8/3':'ولادت امام حسین (ع)','8/4':'ولادت حضرت عباس (ع)','8/5':'ولادت امام سجاد (ع)','9/1':'آغاز ماه رمضان','9/15':'ولادت امام حسن مجتبی (ع)','9/19':'ضربت خوردن امام علی (ع)','11/1':'ولادت حضرت معصومه (س)','11/11':'ولادت امام رضا (ع)','12/9':'روز عرفه'};

let off=0;try{off=+localStorage.getItem('ho')||0}catch(e){}
const hf=new Intl.DateTimeFormat('en-u-ca-islamic-civil-nu-latn',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'});
function hijCivil(j){const[g,m,d]=d2g(j);const p={};hf.formatToParts(new Date(Date.UTC(g,m-1,d+off,12))).forEach(x=>p[x.type]=parseInt(x.value));return[p.year,p.month,p.day]}
// آغاز ماه‌های قمری بر اساس تقویم رسمی ایران (آخرین به‌روزرسانی: ۹ آبان ۱۴۰۵)
const ANC=[[1448,1,2026,6,16],[1448,2,2026,7,16],[1448,3,2026,8,14],[1448,4,2026,9,13],[1448,5,2026,10,12],[1448,6,2026,11,11],[1448,9,2027,2,8],[1448,10,2027,3,10]].map(a=>[a[0],a[1],g2d(a[2],a[3],a[4])]);
function hij(j){let a=null,n=null;for(const x of ANC){if(x[2]<=j)a=x;else{n=x;break}}
 if(a){const d=j-a[2]+1;if(d<=29||(n&&n[0]==a[0]&&n[1]==a[1]+1&&d<=30))return[a[0],a[1],d]}
 return hijCivil(j)}
function evs(j){const[,jm,jd]=d2j(j),[,hm,hd]=hij(j),a=[],k=jm+'/'+jd,h=hm+'/'+hd;
 if(JH[k])a.push({t:JH[k],o:1});
 if(HH[h])a.push({t:HH[h],o:1,r:1});
 if(hm==2&&hd==29&&hij(j+1)[1]==3)a.push({t:HH['2/30'],o:1,r:1});
 if(JO[k])a.push({t:JO[k],n:1});
 if(HO[h])a.push({t:HO[h],r:1});
 return a}
const isRed=j=>isFri(j)||evs(j).some(e=>e.o);
// مناسبت‌های ایران باستان

 if(h===null)return;
 h=(h+((screen.orientation&&screen.orientation.angle)||0)+360)%360;cpGot=true;
 cpMsg(cpRel?'حسگر فقط جهت نسبی می‌دهد؛ شمال ممکن است دقیق نباشد. گوشی را شش‌راهی (هشت) به همراه کالیبره کنید.':'');
 const r=document.getElementById('cpr');if(!r)return;
 r.setAttribute('transform','rotate('+(-h)+')');
 document.getElementById('cph').textContent=DIRS[Math.round(h/45)%8]+' · '+fa(Math.round(h))+'°'}
let cpS=null;
function stopCp(){removeEventListener('deviceorientationabsolute',cpHandler,true);removeEventListener('deviceorientation',cpHandler,true);if(cpS){try{cpS.stop()}catch(e){}cpS=null}}
function cpSensor(){if(cpGot||!document.getElementById('cpo'))return;
 try{if('AbsoluteOrientationSensor' in window){const s=new AbsoluteOrientationSensor({frequency:20});
  s.addEventListener('reading',()=>{const q=s.quaternion,y=Math.atan2(2*(q[3]*q[2]+q[0]*q[1]),1-2*(q[1]*q[1]+q[2]*q[2]));cpHandler({webkitCompassHeading:(-y*180/Math.PI+360)%360})});
  s.addEventListener('error',()=>{});s.start();cpS=s}}catch(e){}}
function closeCp(){const o=document.getElementById('cpo');if(o)o.remove();stopCp()}
async function startCp(){
 try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)DeviceMotionEvent.requestPermission()}catch(x){}if(p!=='granted'){cpMsg('اجازه دسترسی به حسگر جهت داده نشد.');return}}}
 catch(e){cpMsg('دسترسی به حسگر جهت ممکن نیست.');return}
 addEventListener('deviceorientationabsolute',cpHandler,true);addEventListener('deviceorientation',cpHandler,true);
 setTimeout(cpSensor,1500);
 setTimeout(()=>{if(!cpGot)cpMsg('هیچ داده‌ای از حسگر نرسید. احتمالاه محیط نمایش (مثلاً داخل اپ یا قابقاب) اجازه حسگر را نمی‌دهد. لینک صفحه را در Chrome یا Safari باز کنید. [رویداد: '+cpEv+' | امن: '+(window.isSecureContext?'بله':'خیر')+' | پشتیبانی: '+('DeviceOrientationEvent' in window?'بله':'خیر')+']')},3000)}
function openCompass(){
 if(document.getElementById('cpo')){closeCp();return}
 cpGot=false;const o=document.createElement('div');o.id='cpo';o.className='cpo';
 o.innerHTML=`<div class="cpb"><div class="row"><b>قطب‌نما</b><button class="btn" id="cpx">بستن</button></div>
 <div class="cpw"><div class="cpt">▼</div><svg viewBox="-110 -110 220 220" width="100%"><g id="cpr">
 <circle r="100" fill="none" stroke="var(--bd)" stroke-width="3"/><circle r="58" fill="none" stroke="var(--bd)"/>
 <path d="M0-56L8 0L-8 0Z" fill="var(--rd)"/><path d="M0 56L8 0L-8 0Z" fill="var(--mu)" opacity=".5"/>
 <g font-size="15" font-weight="700" text-anchor="middle" fill="var(--tx)"><text y="-72" fill="var(--rd)">شمال</text><text y="84">جنوب</text><text x="76" y="5">شرق</text><text x="-76" y="5">غرب</text></g></g></svg></div>
 <div id="cph" style="text-align:center;font-size:20px;font-weight:800">—</div><button class="btn pri" id="cpa" style="width:100%;margin-top:8px">فعال‌سازی حسگرها</button><div id="cpm" class="foot" style="margin-top:6px"></div></div>`;
 document.body.appendChild(o);document.getElementById('cpx').onclick=closeCp;document.getElementById('cpa').onclick=()=>{cpGot=false;cpEv=0;cpRel=false;cpMsg('');stopCp();startCp()};startCp()}
function corr(sy,gy,hy){
 const f=(c,j)=>{const r=fromJ(c,j);return `${fa(r[2])} ${MN[c][r[1]-1]} (${fa(r[1])})`};
 const rg=(c,s,e)=>`از ${f(c,s)}<br>تا ${f(c,e)}`;
 const tb=(t,h,rows)=>`<h2 style="margin-top:16px">${t}</h2><div style="overflow-x:auto"><table class="mt"><tr><th>#</th><th>${h}</th><th>معادل</th></tr>${rows}</table></div>`;
 const row=(i,n,x)=>`<tr><td>${fa(i)}</td><td>${n}</td><td>${x}</td></tr>`;
 let a='',c='';
 for(let m=1;m<=12;m++){
  const s=j2d(sy,m,1),e=s+mlen(sy,m)-1;a+=row(m,JM[m-1],rg(1,s,e));
  const gs=g2d(gy,m,1),ge=(m<12?g2d(gy,m+1,1):g2d(gy+1,1,1))-1;c+=row(m,GM[m-1]+'<small>'+GE[m-1]+'</small>',rg(0,gs,ge));
 }
 return `<div class="sub" style="color:var(--mu);font-size:12px">عدد داخل پرانتز شماره ماه است. سال مبنای جدول‌ها سال روز انتخابی است.</div>`
  +tb('ماه‌های شمسی '+fa(sy)+' در تقویم میلادی','شمسی',a)
  +tb('ماه‌های میلادی '+fa(gy)+' در تقویم شمسی','میلادی',c)}
let cv={f:0,t:1,y:null,m:1,d:1,res:''};
function fromJ(c,j){return c==0?d2j(j):c==1?d2g(j):hij(j)}
function toJ(c,y,m,d){
 if(!Number.isInteger(y)||!Number.isInteger(d)||m<1||m>12||d<1)return null;
 if(c==0)return d>mlen(y,m)?null:j2d(y,m,d);
 if(c==1){const j=g2d(y,m,d),g=d2g(j);return g[0]==y&&g[1]==m&&g[2]==d?j:null}
 if(d>30)return null;
 const e=d+Math.ceil(29.5*(m-1))+(y-1)*354+Math.floor((3+11*y)/30)+1948439;
 for(let k=-3;k<=3;k++){const h=hij(e+k);if(h[0]==y&&h[1]==m&&h[2]==d)return e+k}
 return null}
function renderConv(){
 const el=document.getElementById('cv'),C=['شمسی','میلادی','قمری'];
 if(cv.y===null){const a=fromJ(0,today);cv.y=a[0];cv.m=a[1];cv.d=a[2]}
 const opt=(arr,v)=>arr.map((x,i)=>`<option value="${i}"${i==v?' selected':''}>${x}</option>`).join('');
 const mo=MN[cv.f].map((n,i)=>`<option value="${i+1}"${i+1==cv.m?' selected':''}>${fa(i+1)} - ${n}</option>`).join('');
 el.innerHTML=`<h2>تبدیل تاریخ</h2>
 <div class="row" style="margin-bottom:8px"><label>از <select id="cf" class="sl">${opt(C,cv.f)}</select></label><label>به <select id="ct" class="sl">${opt(C,cv.t)}</select></label><button class="btn" id="cs">روز انتخابی</button></div>
 <div class="row" style="margin-bottom:8px"><input class="ti" style="margin:0;flex:1;min-width:0" id="cy" type="number" inputmode="numeric" placeholder="سال" value="${cv.y}"><select id="cm" class="sl" style="flex:1.4;min-width:0">${mo}</select><input class="ti" style="margin:0;flex:.7;min-width:0" id="cd" type="number" inputmode="numeric" placeholder="روز" value="${cv.d}"></div>
 <button class="btn pri" id="cg">تبدیل</button>
 <div class="dt" style="margin-top:8px">${cv.res}</div>`;
 const g=id=>document.getElementById(id),rd=()=>{cv.y=g('cy').value;cv.d=g('cd').value;cv.m=+g('cm').value};
 g('cf').onchange=e=>{rd();cv.f=+e.target.value;cv.res='';renderConv()};
 g('ct').onchange=e=>{cv.t=+e.target.value};
 g('cs').onclick=()=>{const a=fromJ(cv.f,sel);cv.y=a[0];cv.m=a[1];cv.d=a[2];cv.res='';renderConv()};
 g('cg').onclick=()=>{rd();const j=toJ(cv.f,Number(cv.y),cv.m,Number(cv.d));
  if(j===null)cv.res='<span style="color:var(--rd)">تاریخ واردشده معتبر نیست.</span>';
  else{const r=fromJ(cv.t,j);cv.res=`<b>نتیجه (${C[cv.t]}):</b><br>${wdOf(j)} ${fa(r[2])} ${mnm(cv.t,r[1])} ${fa(r[0])}`}
  renderConv()};
}
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
